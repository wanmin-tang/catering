<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Заказ кейтеринга · Алматы</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Макет: три шага сверху; на шаге «Блюда» — каталог слева и закреплённая смета справа (на телефоне — нижняя панель). */
:root {
  --bg: #f4f6f3;
  --surface: #ffffff;
  --surface-2: #eef2ee;
  --ink: #18201c;
  --muted: #5d6862;
  --line: #dde3de;
  --line-strong: #c3ccc5;
  --accent: #2c6a4c;
  --accent-ink: #ffffff;
  --accent-soft: #e2efe7;
  --warn: #9a5b00;
  --warn-soft: #fbf1e1;
  --error: #b3261e;
  --error-soft: #fcebea;
  --shadow: 0 1px 2px rgba(24, 32, 28, .06), 0 8px 24px rgba(24, 32, 28, .06);
  --font-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121714; --surface: #1a211d; --surface-2: #222b26; --ink: #e8eee9; --muted: #a2ada6;
    --line: #2e3833; --line-strong: #3f4b44; --accent: #6fbf95; --accent-ink: #0f1a14; --accent-soft: #1f3529;
    --warn: #e7b066; --warn-soft: #33281a; --error: #f2948d; --error-soft: #3a1f1d;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121714; --surface: #1a211d; --surface-2: #222b26; --ink: #e8eee9; --muted: #a2ada6;
  --line: #2e3833; --line-strong: #3f4b44; --accent: #6fbf95; --accent-ink: #0f1a14; --accent-soft: #1f3529;
  --warn: #e7b066; --warn-soft: #33281a; --error: #f2948d; --error-soft: #3a1f1d;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 17px/1.5 var(--font-body);
  font-variant-numeric: tabular-nums;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

.wrap {
  max-width: 1240px;
  margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}

/* ---------- Шапка и шаги ---------- */
.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { padding-block: 22px 0; display: grid; gap: 18px; }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.brand h1 { margin: 0; font: 600 clamp(24px, 3.4vw, 32px)/1.15 var(--font-display); letter-spacing: -.01em; text-wrap: balance; }
.brand p { margin: 0; color: var(--muted); font-size: 16px; }
.steps { display: flex; gap: 4px; overflow-x: auto; margin-bottom: -1px; }
.step {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 18px 14px; border: 0; background: none;
  border-bottom: 3px solid transparent; color: var(--muted);
  font-weight: 600; font-size: 16px; white-space: nowrap;
}
.step .n {
  display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
  background: var(--surface-2); color: var(--muted); font-size: 14px;
}
.step[aria-current="step"] { color: var(--ink); border-bottom-color: var(--accent); }
.step[aria-current="step"] .n { background: var(--accent); color: var(--accent-ink); }
.step.done .n { background: var(--accent-soft); color: var(--accent); }
.step:disabled { cursor: default; opacity: .55; }

.demo-note {
  background: var(--warn-soft); color: var(--warn); font-size: 15px;
  border-bottom: 1px solid var(--line);
}
.demo-note .wrap { padding-block: 10px; }

main .wrap { padding-block: 28px 120px; }
h2.view-title { margin: 0 0 6px; font: 600 24px/1.2 var(--font-display); text-wrap: balance; }
.view-lead { margin: 0 0 22px; color: var(--muted); max-width: 64ch; }

/* ---------- Шаг 1: партнёры ---------- */
.partners { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 22px; }
.partner {
  display: grid; gap: 2px; text-align: left; min-width: 180px;
  padding: 14px 18px; border-radius: var(--radius);
  background: var(--surface); border: 2px solid var(--line);
}
.partner b { font-size: 19px; font-weight: 700; }
.partner span { font-size: 14px; color: var(--muted); }
.partner[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.partner[aria-pressed="true"] span { color: var(--accent); }
.partner .pnote { margin-top: 2px; font-size: 14px; font-weight: 600; color: var(--ink); }
.partner[aria-pressed="true"] .pnote { color: var(--ink); }

.switch-warning {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
  padding: 14px 18px; margin: -8px 0 22px; border-radius: var(--radius);
  background: var(--warn-soft); color: var(--ink);
}

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 28px; align-items: start; }

.toolbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: grid; gap: 12px; padding-block: 12px; margin-bottom: 8px;
  background: var(--bg);
}
.search {
  width: 100%; padding: 13px 16px; border-radius: var(--radius);
  border: 1px solid var(--line-strong); background: var(--surface); font-size: 17px;
}
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.chip {
  flex: none; padding: 8px 14px; border-radius: 999px; font-size: 15px; font-weight: 500;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); white-space: nowrap;
}
.chip.active { background: var(--ink); border-color: var(--ink); color: var(--bg); }

/* ---------- Категории и позиции ---------- */
.category { margin-top: 26px; scroll-margin-top: 140px; }
.category > h3 {
  margin: 0 0 4px; padding: 14px 0 10px;
  font: 600 21px/1.25 var(--font-display); letter-spacing: -.005em;
  border-bottom: 2px solid var(--ink);
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
}
.category > h3 small { font: 500 14px var(--font-body); color: var(--muted); }
.section-title {
  margin: 18px 0 0; padding: 8px 0;
  font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  border-bottom: 1px solid var(--line);
}
.items { list-style: none; margin: 0; padding: 0; }
.item {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px 20px;
  padding: 14px 0; border-bottom: 1px solid var(--line);
}
.item.picked { background: linear-gradient(90deg, var(--accent-soft), transparent 70%); margin-inline: -12px; padding-inline: 12px; border-radius: 8px; }
.item-name { font-size: 17px; font-weight: 500; overflow-wrap: anywhere; }
.item-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 4px; font-size: 15px; color: var(--muted); }
.item-price { font-weight: 600; color: var(--ink); }
.tag { display: inline-block; padding: 1px 8px; border-radius: 6px; background: var(--warn-soft); color: var(--warn); font-size: 13px; font-weight: 600; }
.item.info .item-name { color: var(--muted); }

.qty { display: flex; align-items: center; gap: 6px; }
.qty button, .add {
  min-width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line-strong);
  background: var(--surface); font-size: 22px; font-weight: 500; line-height: 1;
}
.add { padding: 0 18px; font-size: 16px; font-weight: 600; color: var(--accent); border-color: var(--accent); }
.qty input {
  width: 68px; height: 44px; text-align: center; border-radius: 10px;
  border: 1px solid var(--line-strong); background: var(--surface); font-size: 17px; font-weight: 600;
}
.qty.invalid input { border-color: var(--error); color: var(--error); background: var(--error-soft); }
.qty-hint { grid-column: 1 / -1; margin-top: -4px; font-size: 14px; color: var(--error); }
.empty-search { padding: 28px 0; color: var(--muted); }

/* ---------- Смета (корзина) ---------- */
.cart {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px);
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
  display: grid; max-height: calc(100vh - 32px);
}
.cart-head { padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
.cart-head h3 { margin: 0; font: 600 19px/1.2 var(--font-display); }
.cart-head p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
.cart-body { overflow-y: auto; padding: 4px 20px; min-height: 0; }
.cart-line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.cart-line:last-child { border-bottom: 0; }
.cart-line .nm { font-weight: 500; overflow-wrap: anywhere; }
.cart-line .sm { font-weight: 600; text-align: right; white-space: nowrap; }
.cart-line .calc { color: var(--muted); }
.cart-line .rm { justify-self: end; border: 0; background: none; color: var(--muted); font-size: 14px; text-decoration: underline; padding: 0; }
.cart-line.bad .calc { color: var(--error); }
.cart-empty { padding: 22px 0; color: var(--muted); font-size: 15px; }
.cart-foot { padding: 16px 20px 20px; border-top: 1px solid var(--line); display: grid; gap: 12px; }
.total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.total span { color: var(--muted); }
.total b { font: 600 24px/1 var(--font-display); }

.btn {
  display: inline-flex; justify-content: center; align-items: center; gap: 8px;
  min-height: 52px; padding: 0 24px; border-radius: 12px; border: 0;
  background: var(--accent); color: var(--accent-ink); font-size: 17px; font-weight: 600;
}
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); }
.btn.small { min-height: 40px; padding: 0 16px; font-size: 15px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }

.mobile-bar { display: none; }

/* ---------- Шаг 1: подходы ---------- */
.yesno { display: flex; gap: 8px; }
.yesno button { flex: 1; min-height: 48px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 600; }
.yesno button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.approaches { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); display: grid; gap: 16px; }
.approaches-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.approaches-head h3 { margin: 0; font: 600 19px/1.2 var(--font-display); }
.counter { display: flex; align-items: center; gap: 8px; }
.counter button { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 22px; }
.counter b { min-width: 28px; text-align: center; font-size: 19px; }
.approach { border: 1px solid var(--line); border-radius: 14px; padding: 16px; background: var(--surface-2); display: grid; gap: 12px; }
.approach h4 { margin: 0; font-size: 16px; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag-btn { padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 15px; font-weight: 500; }
.tag-btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.approach input { width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 16px; }
.times { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line); }

/* ---------- Шаг 2: ИИ ---------- */
.ai-box { display: grid; gap: 12px; padding: 18px 20px; margin-bottom: 22px; border-radius: 16px; border: 1px solid var(--accent); background: var(--accent-soft); }
.ai-box h3 { margin: 0; font: 600 18px/1.25 var(--font-display); }
.ai-box p { margin: 0; color: var(--muted); }
.ai-brief { font-size: 15px; color: var(--ink); }
.ai-result { padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.ai-result b { display: block; margin-bottom: 4px; }
.warn { padding: 12px 16px; border-radius: 12px; background: var(--warn-soft); color: var(--ink); }
.partner .no-waiters, .partner[aria-pressed="true"] .no-waiters { color: var(--warn); font-weight: 600; font-size: 14px; }
.budget-line { font-size: 14px; color: var(--muted); }
.budget-line.over { color: var(--error); font-weight: 600; }

/* ---------- Шаг 2: форма ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 26px; max-width: 860px; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 24px; }
.field { display: grid; gap: 6px; }
.field.wide { grid-column: 1 / -1; }
.field label { font-weight: 600; font-size: 16px; }
.field label i { color: var(--error); font-style: normal; }
.field input, .field textarea {
  width: 100%; padding: 13px 14px; border-radius: 10px; border: 1px solid var(--line-strong);
  background: var(--surface); font-size: 17px;
}
.field textarea { min-height: 96px; resize: vertical; }
.field small { color: var(--muted); font-size: 14px; }
.field.error input, .field.error textarea { border-color: var(--error); background: var(--error-soft); }
.field .err { color: var(--error); font-size: 14px; }
.pin-block { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); max-width: 420px; }

/* ---------- Шаг 3: проверка ---------- */
.review { display: grid; gap: 16px; max-width: 980px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
.fact { padding: 14px 18px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); }
.fact dt { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.fact dd { margin: 4px 0 0; font-weight: 500; overflow-wrap: anywhere; }
.table-box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 620px; }
th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); }
td.num, th.num { text-align: right; white-space: nowrap; }
td.n { color: var(--muted); width: 48px; }
tr.cat td { background: var(--accent-soft); font: 600 16px var(--font-display); color: var(--ink); }
tr.sec td { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-block: 8px; }
tr.sum td { font-weight: 700; font-size: 18px; background: var(--surface-2); border-bottom: 0; }
.alert { padding: 16px 18px; border-radius: 12px; background: var(--error-soft); color: var(--error); }
.alert ul { margin: 6px 0 0; padding-left: 20px; }
.ok-view { max-width: 640px; }
.ok-badge { display: inline-grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 28px; font-weight: 700; margin-bottom: 14px; }
.links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
.links a { color: var(--accent); font-weight: 600; }
.loading { padding: 60px 0; color: var(--muted); }

/* ---------- Телефон ---------- */
@media (max-width: 960px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .cart { position: static; max-height: none; }
  .mobile-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 20px rgba(0,0,0,.08);
  }
  .mobile-bar .mt { display: grid; font-size: 14px; color: var(--muted); }
  .mobile-bar .mt b { font: 600 19px var(--font-display); color: var(--ink); }
  .mobile-bar .btn { min-height: 48px; padding: 0 18px; }
}
@media (max-width: 640px) {
  body { font-size: 16px; }
  .fields { grid-template-columns: minmax(0, 1fr); }
  .panel { padding: 18px; }
  .item { grid-template-columns: minmax(0, 1fr); }
  .qty { justify-self: start; }
  .partner { min-width: 0; flex: 1 1 140px; }
  .step { padding-inline: 10px; }
  .step .lbl-long { display: none; }
}
.boxes { display: grid; gap: 14px; padding: 18px 20px; margin-bottom: 22px; border-radius: 16px; border: 1px solid var(--line-strong); background: var(--surface); }
.boxes-head { display: flex; gap: 16px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.boxes-head h3 { margin: 0 0 4px; font: 600 18px/1.25 var(--font-display); }
.boxes-head p { margin: 0; color: var(--muted); max-width: 560px; }
.box-cards { display: grid; gap: 10px; }
.box-card { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); }
.box-card.open { border-color: var(--accent); background: var(--accent-soft); }
.box-card.bad { border-color: var(--warn); }
.box-main { display: grid; gap: 3px; text-align: left; background: none; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; min-width: 0; }
.box-main span { color: var(--muted); font-size: 14px; }
.box-list { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.box-main .box-problem { color: var(--warn); font-weight: 600; }
.box-tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
.box-sum { font-weight: 700; min-width: 90px; text-align: right; }
.link { background: none; border: 0; padding: 4px; color: var(--accent); font: inherit; font-size: 14px; text-decoration: underline; cursor: pointer; }
.box-editor { display: grid; gap: 12px; padding-top: 14px; border-top: 1px solid var(--line); }
.box-editor-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; position: sticky; top: 0; }
.box-progress { flex: 1; min-width: 120px; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.box-progress i { display: block; height: 100%; background: var(--accent); }
.box-groups { max-height: 60vh; overflow: auto; padding-right: 4px; }
.check { display: flex; gap: 10px; align-items: center; font-weight: 500; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.muted { color: var(--muted); font-weight: 400; }
@media (max-width: 640px) { .box-card { grid-template-columns: 1fr; } .box-tools { justify-content: space-between; } }
</style>
</head>
<body>


<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Заказ кейтеринга</h1>
      <p id="brand-sub">Опишите мероприятие, соберите меню сами или с помощью ИИ и отправьте заявку кейтерингу в Telegram.</p>
    </div>
    <nav class="steps" aria-label="Шаги заказа">
      <button class="step" id="step-1" data-step="1" type="button"><span class="n">1</span>Мероприятие</button>
      <button class="step" id="step-2" data-step="2" type="button"><span class="n">2</span>Меню</button>
      <button class="step" id="step-3" data-step="3" type="button"><span class="n">3</span>Реквизиты</button>
      <button class="step" id="step-4" data-step="4" type="button"><span class="n">4</span>Проверка<span class="lbl-long">&nbsp;и отправка</span></button>
    </nav>
  </div>
</header>
<div class="demo-note" id="demo-note" hidden>
  <div class="wrap">Демо-режим: показано меню Рассвета из вашей таблицы, заявка никуда не отправляется. После подключения к таблице здесь появятся все партнёры.</div>
</div>

<main>
  <div class="wrap" id="app"><div class="loading">Загружаем меню…</div></div>
</main>

<div class="mobile-bar" id="mobile-bar" hidden>
  <div class="mt"><span id="mb-count">0 позиций</span><b id="mb-total">0 сум</b></div>
  <button class="btn" id="mb-next" type="button">Дальше</button>
</div>

<script>

const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('ru-RU').replace(/ |\s/g, ' ');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function plural(n, one, few, many) {
  const a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return one;
  if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return few;
  return many;
}
const cur = () => (state.menu && state.menu.currency) || 'сум';
const positions = n => `${n} ${plural(n, 'позиция', 'позиции', 'позиций')}`;

function save() {

    localStorage.setItem(STORE_KEY, JSON.stringify({
      partner: state.partner, qty: state.qty, details: state.details, approaches: state.approaches, pin: state.pin, boxes: state.boxes,
    }));
  } catch (e) { /* хранилище недоступно — черновик не сохранится */ }
}
function restore() {
  try {
    const data = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    Object.assign(state, {
      partner: data.partner || '', qty: data.qty || {}, details: data.details || {}, pin: data.pin || '',
      approaches: Array.isArray(data.approaches) && data.approaches.length ? data.approaches : state.approaches,
      boxes: Array.isArray(data.boxes) ? data.boxes : [],
    });
  } catch (e) { /* пусто */ }
}

/* ============================ Меню и расчёты ============================ */
function normalizeMenu(menu) {
  // Демо хранит позиции массивами; API отдаёт объекты. Приводим к одному виду.
  menu.partners.forEach(p => p.categories.forEach(c => c.sections.forEach(s => {
    s.items = s.items.map(it => Array.isArray(it)
      ? { id: String(it[0]), number: it[1], name: it[2], extra: it[3], price: it[4], min: it[5] || p.minQuantity || 1, step: it[6] || 1,
          box: Boolean(p.box && (p.boxCategories || []).indexOf(c.title) >= 0 && it[4]) }
      : Object.assign({}, it, { id: String(it.id), min: it.min || p.minQuantity || 1, step: it.step || 1 }));
  })));
  menu.approachTags = menu.approachTags || [];
  menu.approachMax = menu.approachMax || 5;
  return menu;
}

const fields = stage => state.menu.fields.filter(f => (f.stage || 'final') === stage);
function currentPartner() {
  return state.menu.partners.find(p => p.name === state.partner) || state.menu.partners[0];
}
function allItems(partner) {
  const list = [];
  partner.categories.forEach(c => c.sections.forEach(s => s.items.forEach(it => list.push({ item: it, category: c.title, section: s.title }))));
  return list;
}
function lineState(item) {
  const raw = state.qty[item.id];
  if (raw === undefined || raw === '' || raw === 0) return null;
  const n = Number(raw);
  let problem = '';
  if (!Number.isInteger(n) || n <= 0) problem = 'введите целое число';
  else if (n < item.min) problem = `минимум ${item.min} шт.`;
  else if (n % item.step) problem = `только кратно ${item.step}: ${Math.floor(n / item.step) * item.step || item.step} или ${Math.ceil(n / item.step) * item.step}`;
  return { qty: n, problem, sum: problem ? 0 : n * item.price };
}
function cartLines() {
  return allItems(currentPartner())
    .map(e => Object.assign(e, { line: e.item.price != null ? lineState(e.item) : null }))
    .filter(e => e.line);
}
function boxesAvailable(partner) { return Boolean((partner || currentPartner()).box) && !wantsWaiters(); }
function boxCapacity() { const b = currentPartner().box; return b ? b.capacity : 0; }
function boxState(box) {
  const lines = Object.keys(box.items).map(id => ({ item: findItem(id), perBox: Number(box.items[id]) }))
    .filter(l => l.item && l.perBox > 0).sort((a, b) => Number(a.item.id) - Number(b.item.id));
  const filled = lines.reduce((n, l) => n + l.perBox, 0);
  const unit = lines.reduce((n, l) => n + l.perBox * l.item.price, 0);
  const cap = boxCapacity();
  const count = Number(box.count);
  let problem = '';
  if (!boxesAvailable()) problem = 'боксы — только без официантов';
  else if (filled < cap) problem = `добавьте ещё ${cap - filled} шт.`;
  else if (filled > cap) problem = `уберите ${filled - cap} шт.`;
  else if (!Number.isInteger(count) || count < 1) problem = 'укажите количество боксов';
  return { lines, filled, unit, count: count || 0, total: problem ? 0 : unit * count, problem };
}
function totals() {
  const lines = cartLines();
  const boxes = state.boxes.map(boxState);
  const bad = lines.filter(e => e.line.problem).length + boxes.filter(b => b.problem).length;
  const sum = lines.reduce((t, e) => t + e.line.sum, 0) + boxes.reduce((t, b) => t + b.total, 0);
  return { lines, boxes, bad, sum, count: lines.length + boxes.length };
}
const budget = () => Number(state.details.budget) > 0 ? Number(state.details.budget) : 0;
function wantsWaiters() { return /^да$/i.test(String(state.details.waiters || '')); }

/* ============================== Проверки ============================== */
function validate(stage) {
  const errors = {};
  const today = new Date(); today.setHours(0, 0, 0, 0);
  fields(stage).forEach(f => {
    const v = String(state.details[f.key] || '').trim();
    if (!v) { if (f.required) errors[f.key] = f.type === 'yesno' ? 'Выберите вариант' : 'Заполните поле'; return; }
    if (f.type === 'number') {
      const min = f.min == null ? 1 : f.min;
      if (!(Number.isInteger(Number(v)) && Number(v) >= min)) errors[f.key] = min > 0 ? `Нужно целое число от ${min}` : 'Нужно целое число';
    }
    if (f.type === 'time' && !/^\d{1,2}:\d{2}/.test(v)) errors[f.key] = 'Укажите время';
    if (f.type === 'date') {
      const d = new Date(`${v}T00:00:00`);
      if (isNaN(d)) errors[f.key] = 'Выберите дату';
      else if (d < today) errors[f.key] = 'Дата уже прошла';
    }
  });
  if (stage === 'brief' && !state.approaches.some(a => a.tags.length || a.note.trim())) {
    errors.__approaches = 'Отметьте, что подать хотя бы в одном подходе';
  }
  if (stage === 'final') {
    if (state.approaches.length > 1) {
      state.approaches.forEach((a, i) => { if (!/^\d{1,2}:\d{2}/.test(a.time || '')) errors[`__time${i}`] = 'Укажите время'; });
    }
    if (state.menu.requiresPin && !String(state.pin).trim()) errors.__pin = 'Введите код доступа';
  }
  return { ok: !Object.keys(errors).length, errors };
}
const menuReady = () => { const t = totals(); return t.count > 0 && !t.bad; };
function maxStep() {
  if (!validate('brief').ok) return 1;
  if (!menuReady()) return 2;
  if (!validate('final').ok) return 3;
  return 4;
}

/* ================================ Отрисовка ================================ */
function render() {
  const top = maxStep();
  [1, 2, 3, 4].forEach(n => {
    const b = $(`step-${n}`);
    b.setAttribute('aria-current', state.step === n && !state.result ? 'step' : 'false');
    b.classList.toggle('done', n < state.step || Boolean(state.result));
    b.disabled = Boolean(state.result) || n > top;
  });
  if (state.result) return renderDone();
  if (state.step === 1) renderBrief();
  if (state.step === 2) renderCatalog();
  if (state.step === 3) renderFinal();
  if (state.step === 4) renderReview();
  updateMobileBar();
}

function fieldHtml(f, errs) {
  const id = `f-${f.key}`;
  const raw = state.details[f.key] || '';
  const value = esc(raw);
  const err = state.showErrors && errs[f.key];
  let input;
  if (f.type === 'yesno') {
    input = `<div class="yesno" role="group" aria-label="${esc(f.label)}">
      <button type="button" data-yesno="${f.key}" data-value="да" aria-pressed="${raw === 'да'}">Да</button>
      <button type="button" data-yesno="${f.key}" data-value="нет" aria-pressed="${raw === 'нет'}">Нет</button></div>`;
  } else if (f.type === 'textarea') {
    input = `<textarea id="${id}" data-field="${f.key}"${f.placeholder ? ` placeholder="${esc(f.placeholder)}"` : ''}>${value}</textarea>`;
  } else {
    const type = ['date', 'time', 'number'].indexOf(f.type) >= 0 ? f.type : 'text';
    const number = f.type === 'number' ? ` min="${f.min == null ? 1 : f.min}" step="1" inputmode="numeric"` : '';
    input = `<input id="${id}" data-field="${f.key}" type="${type}"${number}${f.placeholder ? ` placeholder="${esc(f.placeholder)}"` : ''} value="${value}">`;
  }
  return `<div class="field${f.wide || f.type === 'textarea' ? ' wide' : ''}${err ? ' error' : ''}">
    <label for="${id}">${esc(f.label)}${f.required ? ' <i>*</i>' : ''}</label>${input}
    ${err ? `<span class="err">${esc(errs[f.key])}</span>` : f.hint ? `<small>${esc(f.hint)}</small>` : ''}
  </div>`;
}

        ${state.approaches.map((a, i) => `

    ${boxesAvailable(partner) ? `<label class="check"><input type="checkbox" data-ai-boxes ${a.useBoxes ? 'checked' : ''}> Разложить закуски по боксам (по ${partner.box.capacity} шт.)</label>` : ''}
    ${a.error ? `<div class="alert" role="alert">${esc(a.error)}</div>` : ''}

    ${a.confirm ? `<div class="warn">В смете уже есть позиции — подборка ИИ заменит их.

}

/* ---------- Боксы с закусками ---------- */
function renderBoxes() {
  const slot = $('boxes');
  if (!slot) return;
  const partner = currentPartner();
  if (!partner.box || (!boxesAvailable() && !state.boxes.length)) { slot.innerHTML = ''; return; }
  const cap = partner.box.capacity;
  const open = state.boxes[state.openBox];

  const cards = state.boxes.map((box, i) => {
    const b = boxState(box);
    return `<div class="box-card${i === state.openBox ? ' open' : ''}${b.problem ? ' bad' : ''}">
      <button class="box-main" type="button" data-box-open="${i}">
        <b>Бокс ${i + 1}</b>
        <span>${b.filled} из ${cap} · ${fmt(b.unit)} ${cur()} за бокс</span>
        ${b.problem ? `<span class="box-problem">${esc(b.problem)}</span>` : `<span class="box-list">${b.lines.map(l => `${esc(l.item.name)} ×${l.perBox}`).join(', ')}</span>`}
      </button>
      <div class="box-tools">
        <div class="qty small-qty" title="Сколько таких боксов">
          <button type="button" data-box-dec="${i}" aria-label="Меньше боксов">−</button>
          <input inputmode="numeric" data-box-count="${i}" value="${esc(box.count)}" aria-label="Количество боксов ${i + 1}">
          <button type="button" data-box-inc="${i}" aria-label="Больше боксов">+</button>
        </div>
        <span class="box-sum">${b.problem ? '—' : `${fmt(b.total)} ${cur()}`}</span>
        <button class="link" type="button" data-box-copy="${i}">копия</button>
        <button class="link" type="button" data-box-del="${i}">удалить</button>
      </div>
    </div>`;
  }).join('');

  slot.innerHTML = `<div class="boxes">
    <div class="boxes-head">
      <div><h3>Боксы с закусками</h3>
        <p>${cap} закусок в боксе, наполнение на ваш выбор: канапе, брускетты, салаты, фингер-фуд, выпечка, десерты. Формат без официантов.</p></div>
      ${boxesAvailable() ? `<button class="btn" type="button" data-box-add>+ Собрать бокс на ${cap} закусок</button>` : ''}
    </div>
    ${!boxesAvailable() ? '<div class="warn">Боксы — формат без официантов. На шаге 1 выбрано «официанты нужны»: уберите боксы или измените ответ.</div>' : ''}
    ${cards ? `<div class="box-cards">${cards}</div>` : ''}
    ${open ? boxEditorHtml(open, cap) : ''}
  </div>`;
}

function boxEditorHtml(box, cap) {
  const b = boxState(box);
  const q = state.boxSearch.trim().toLowerCase();
  const partner = currentPartner();
  const groups = [];
  partner.categories.forEach(c => c.sections.forEach(s => {
    const items = s.items.filter(it => it.box && (!q || `${it.name} ${it.extra || ''}`.toLowerCase().includes(q)));
    if (items.length) groups.push({ title: [c.title, s.title].filter(Boolean).join(' · '), items });
  }));
  const full = b.filled >= cap;
  return `<div class="box-editor" id="box-editor">
    <div class="box-editor-head">
      <b>Бокс ${state.openBox + 1}: ${b.filled} из ${cap}</b>
      <div class="box-progress" aria-hidden="true"><i style="width:${Math.min(100, b.filled / cap * 100)}%"></i></div>
      <button class="btn small" type="button" data-box-close>${full ? 'Готово' : 'Свернуть'}</button>
    </div>
    <input class="search" type="search" data-box-search placeholder="Поиск закусок для бокса" value="${esc(state.boxSearch)}" autocomplete="off">
    <div class="box-groups">${groups.map(g => `
      <div class="section-title">${esc(g.title)}</div>
      <ul class="items">${g.items.map(it => {
        const n = Number(box.items[it.id]) || 0;
        return `<li class="item${n ? ' picked' : ''}">
          <div><div class="item-name">${esc(it.name)}</div>
            <div class="item-meta"><span class="item-price">${fmt(it.price)} ${cur()}</span>${it.extra ? `<span>${esc(it.extra)}</span>` : ''}</div></div>
          ${n ? `<div class="qty"><button type="button" data-bx-dec="${it.id}" aria-label="Меньше">−</button>
              <input value="${n}" readonly aria-label="В боксе: ${esc(it.name)}">
              <button type="button" data-bx-inc="${it.id}" aria-label="Больше" ${full ? 'disabled' : ''}>+</button></div>`
            : `<button class="add" type="button" data-bx-inc="${it.id}" ${full ? 'disabled' : ''}>В бокс</button>`}
        </li>`;
      }).join('')}</ul>`).join('') || `<p class="empty-search">Ничего не нашлось.</p>`}</div>
  </div>`;
}

function refreshBoxes() {
  const scroller = document.querySelector('.box-groups');
  const top = scroller ? scroller.scrollTop : 0;

}

function renderSwitchWarning() {
  const slot = $('switch-slot');
  if (!slot) return;
  if (!state.pendingPartner) { slot.innerHTML = ''; return; }
  slot.innerHTML = `<div class="switch-warning" role="alert">
    <span>В смете уже есть позиции <b>${esc(state.partner)}</b>. В одной заявке — только один кейтеринг.</span>

}

function renderItems() {
  const partner = currentPartner();
  const q = state.search.trim().toLowerCase();
  let shown = 0;
  const html = partner.categories.map((c, ci) => {
    const sections = c.sections.map(s => {
      const items = s.items.filter(it => !q || `${it.name} ${it.extra || ''}`.toLowerCase().includes(q));
      if (!items.length) return '';
      shown += items.length;
      return `${s.title ? `<div class="section-title">${esc(s.title)}</div>` : ''}
        <ul class="items">${items.map(itemHtml).join('')}</ul>`;
    }).join('');

    const count = c.sections.reduce((n, s) => n + s.items.filter(it => it.price != null).length, 0);
    return `<div class="category" id="cat-${ci}"><h3>${esc(c.title)} <small>${positions(count)}</small></h3>${sections}</div>`;
  }).join('');
  $('catalog').innerHTML = shown ? html : `<p class="empty-search">Ничего не нашлось по запросу «${esc(state.search)}».</p>`;
}

function itemHtml(it) {
  if (it.price == null) {
    return `<li class="item info"><div><div class="item-name">${esc(it.name)}</div>
      <div class="item-meta">${esc(it.extra || 'Цена по запросу')} · уточните у поставщика в комментарии</div></div></li>`;
  }
  const line = lineState(it);
  const minTag = (it.min > 1 ? `<span class="tag">от ${it.min} шт.</span>` : '') +
    (it.step > 1 ? `<span class="tag">кратно ${it.step}</span>` : '');
  const extra = it.extra && !/минимальн/i.test(it.extra) ? `<span>${esc(it.extra)}</span>` : '';
  const control = line
    ? `<div class="qty${line.problem ? ' invalid' : ''}">
        <button type="button" data-dec="${it.id}" aria-label="Меньше">−</button>
        <input id="q-${it.id}" inputmode="numeric" data-qty="${it.id}" value="${esc(state.qty[it.id])}" aria-label="Количество: ${esc(it.name)}">
        <button type="button" data-inc="${it.id}" aria-label="Больше">+</button>
      </div>`
    : `<button class="add" type="button" data-add="${it.id}">Добавить</button>`;
  return `<li class="item${line && !line.problem ? ' picked' : ''}" data-row="${it.id}">
    <div>
      <div class="item-name">${esc(it.name)}</div>
      <div class="item-meta"><span class="item-price">${fmt(it.price)} ${cur()}</span>${minTag}${extra}</div>
    </div>
    ${control}
    ${line && line.problem ? `<div class="qty-hint">${esc(line.problem)}</div>` : ''}
  </li>`;
}

function refreshItem(id) {
  const li = document.querySelector(`.item[data-row="${CSS.escape(id)}"]`);
  const it = findItem(id);
  if (!li || !it) return;
  const focused = document.activeElement && document.activeElement.dataset.qty === id;
  const tmp = document.createElement('ul');
  tmp.innerHTML = itemHtml(it);
  li.replaceWith(tmp.firstElementChild);
  if (focused) {
    const input = $(`q-${id}`);
    if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
  }
}
function findItem(id) {
  const found = allItems(currentPartner()).find(e => e.item.id === String(id));
  return found && found.item;
}

function budgetLine(sum) {
  if (!budget()) return '';
  const diff = budget() - sum;
  return diff >= 0
    ? `<span class="budget-line">Бюджет ${fmt(budget())} ${cur()} · остаётся ${fmt(diff)}</span>`
    : `<span class="budget-line over">Бюджет ${fmt(budget())} ${cur()} · превышение на ${fmt(-diff)}</span>`;
}

function displayValue(f) {
  const v = String(state.details[f.key] || '').trim();
  if (!v) return '';
  if (f.type === 'date') { const [y, m, d] = v.split('-'); return `${d}.${m}.${y}`; }
  if (f.type === 'yesno') return /^да$/i.test(v) ? 'Да' : 'Нет';
  if (f.key === 'budget') return `${fmt(Number(v))} ${cur()}`;
  if (f.type === 'number' && !f.required && Number(v) === 0) return '';
  return v;
}
function approachesText() {
  return state.approaches.map((a, i) =>
    `${i + 1}) ${a.time && state.approaches.length > 1 ? `${a.time} — ` : ''}${a.tags.join(', ') || 'по усмотрению кейтеринга'}${a.note ? `; ${a.note}` : ''}`);
}
function boxRows(boxes) {
  if (!boxes.length) return '';
  const rows = ['<tr class="cat"><td colspan="5">Боксы с закусками</td></tr>'];
  boxes.forEach((b, i) => {
    rows.push(`<tr class="sec"><td colspan="5">Бокс ${i + 1} · ${boxCapacity()} закусок · ${b.count} шт. × ${fmt(b.unit)} ${cur()}</td></tr>`);
    b.lines.forEach(l => rows.push(`<tr><td class="n">${esc(l.item.number)}</td><td>${esc(l.item.name)} <span class="muted">— ${l.perBox} в боксе</span></td>
      <td class="num">${fmt(l.item.price)}</td><td class="num">${l.perBox * b.count}</td><td class="num"><b>${fmt(l.perBox * b.count * l.item.price)}</b></td></tr>`));
  });
  return rows.join('');
}
function estimateRows(lines) {
  let cat = null, sec = null;
  const rows = [];
  lines.forEach(e => {
    if (e.category !== cat) { cat = e.category; sec = null; rows.push(`<tr class="cat"><td colspan="5">${esc(cat)}</td></tr>`); }
    if (e.section !== sec) { sec = e.section; if (sec) rows.push(`<tr class="sec"><td colspan="5">${esc(sec)}</td></tr>`); }
    rows.push(`<tr><td class="n">${esc(e.item.number)}</td><td>${esc(e.item.name)}</td>
      <td class="num">${fmt(e.item.price)}</td><td class="num">${e.line.qty}</td><td class="num"><b>${fmt(e.line.sum)}</b></td></tr>`);
  });
  return rows.join('');
}
function factsHtml(stage) {
  return fields(stage).filter(f => displayValue(f)).map(f => `<div class="fact"><dt>${esc(f.label)}</dt><dd>${esc(displayValue(f))}</dd></div>`).join('');
}

/* ================================ Действия ================================ */
function go(step) {
  state.step = Math.max(1, Math.min(step, maxStep()));
  state.errors = [];
  state.showErrors = false;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function next(from) {
  const ok = from === 1 ? validate('brief').ok : from === 2 ? menuReady() : validate('final').ok;
  if (!ok) { state.showErrors = true; render(); return; }
  go(from + 1);
}

function setQty(id, value) {
  if (value === '' || value === 0 || value === null) delete state.qty[id];
  else state.qty[id] = value;
  save();
  refreshItem(id);
  renderCart();
  updateMobileBar();
}

function post(body) {
  return fetch(apiUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
  }).then(r => r.json());
}

function briefPayload() {
  const brief = { approaches: state.approaches.map(a => ({ tags: a.tags, note: a.note })), useBoxes: boxesAvailable() && state.ai.useBoxes };
  fields('brief').forEach(f => { brief[f.key] = String(state.details[f.key] || '').trim(); });
  return brief;
}

async function runAi(force) {
  if (state.ai.loading) return;
  if (totals().count && !force) { state.ai.confirm = true; renderCatalog(); return; }
  state.ai = { loading: true, comment: '', error: '', confirm: false, useBoxes: state.ai.useBoxes };
  renderCatalog();
  try {
    const result = await post({ action: 'suggest', pin: state.pin, partner: currentPartner().name, brief: briefPayload() });
    if (!result.ok) {
      resetAi(); state.ai.error = (result.errors || [result.message || 'Неизвестная ошибка']).join(' ');
    } else {
      state.qty = {};
      (result.items || []).forEach(i => { state.qty[i.id] = i.quantity; });
      state.boxes = (result.boxes || []).map(b => {
        const items = {};
        b.items.forEach(i => { items[String(i.id)] = i.quantity; });
        return { count: b.count, items };
      });
      state.openBox = -1;
      resetAi(); state.ai.comment = result.comment || '';
      save();
    }
  } catch (error) {
    resetAi(); state.ai.error = 'Нет связи с таблицей. Проверьте интернет и попробуйте ещё раз.';
  }
  render();
}

async function send() {
  const t = totals();
  if (state.sending || !t.count || t.bad) return;
  state.sending = true;
  state.errors = [];
  renderReview();

  const partner = currentPartner();
  const details = {};
  state.menu.fields.forEach(f => { details[f.key] = String(state.details[f.key] || '').trim(); });
  details.approaches = state.approaches.map(a => ({ tags: a.tags, note: a.note, time: state.approaches.length > 1 ? a.time : '' }));

  try {
    let result;
    if (DEMO) {
      await new Promise(r => setTimeout(r, 700));
      result = { ok: true, demo: true };
    } else {
      result = await post({
        action: 'order',
        pin: state.pin,
        partner: partner.name,
        items: t.lines.map(e => ({ id: e.item.id, name: e.item.name, quantity: e.line.qty })),
        boxes: t.boxes.map(b => ({ count: b.count, items: b.lines.map(l => ({ id: l.item.id, name: l.item.name, quantity: l.perBox })) })),
        details,
      });
    }
    if (!result.ok) {
      state.errors = result.errors && result.errors.length ? result.errors : [result.message || 'Неизвестная ошибка'];
    } else {
      state.result = Object.assign({ partner: partner.name, positions: t.count, total: t.sum }, result);
      state.qty = {};
      state.details = {};
      state.approaches = [{ tags: [], note: '', time: '' }];
      state.boxes = []; state.openBox = -1;
      resetAi();
      save();
    }
  } catch (error) {
    state.errors = ['Нет связи с таблицей. Проверьте интернет и попробуйте ещё раз через минуту.'];
  } finally {
    state.sending = false;
    render();
  }
}

document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  const d = t.dataset;

  if (d.step) { go(Number(d.step)); return; }
  if (d.go) { const n = Number(d.go); if (n > state.step) next(state.step); else go(n); return; }

  if (d.yesno) { state.details[d.yesno] = d.value; save(); render(); return; }
  if (d.approaches) {
    const n = Math.max(1, Math.min(state.menu.approachMax, state.approaches.length + Number(d.approaches)));
    while (state.approaches.length < n) state.approaches.push({ tags: [], note: '', time: '' });
    state.approaches.length = n;
    save(); render(); return;
  }
  if (d.tag) {
    const a = state.approaches[Number(d.approach)];
    const i = a.tags.indexOf(d.tag);
    if (i >= 0) a.tags.splice(i, 1); else a.tags.push(d.tag);
    t.setAttribute('aria-pressed', String(i < 0));
    save(); if (state.showErrors) render(); else refreshSteps(); return;
  }

  if (d.aiRun !== undefined) { runAi(d.aiRun === 'force'); return; }

  if (d.boxAdd !== undefined) {
    state.boxes.push({ count: Math.max(1, Number(state.details.guests) || 1), items: {} });
    state.openBox = state.boxes.length - 1; state.boxSearch = '';
    save(); refreshBoxes();
    const ed = $('box-editor'); if (ed) ed.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  if (d.boxOpen !== undefined) { const i = Number(d.boxOpen); state.openBox = state.openBox === i ? -1 : i; state.boxSearch = ''; refreshBoxes(); return; }
  if (d.boxClose !== undefined) { state.openBox = -1; refreshBoxes(); return; }
  if (d.boxCopy !== undefined) {
    const src = state.boxes[Number(d.boxCopy)];
    state.boxes.push({ count: src.count, items: Object.assign({}, src.items) });
    state.openBox = state.boxes.length - 1; save(); refreshBoxes(); return;
  }
  if (d.boxDel !== undefined) {
    const i = Number(d.boxDel); state.boxes.splice(i, 1);
    if (state.openBox === i) state.openBox = -1; else if (state.openBox > i) state.openBox -= 1;
    save(); refreshBoxes(); return;
  }
  if (d.boxInc !== undefined || d.boxDec !== undefined) {
    const i = Number(d.boxInc !== undefined ? d.boxInc : d.boxDec);
    const box = state.boxes[i];
    box.count = Math.max(1, (Number(box.count) || 0) + (d.boxInc !== undefined ? 1 : -1));
    save(); refreshBoxes(); return;
  }
  if (d.bxInc || d.bxDec) {
    const box = state.boxes[state.openBox]; if (!box) return;
    const id = d.bxInc || d.bxDec;
    const n = (Number(box.items[id]) || 0) + (d.bxInc ? 1 : -1);
    if (d.bxInc && boxState(box).filled >= boxCapacity()) return;
    if (n > 0) box.items[id] = n; else delete box.items[id];
    save(); refreshBoxes(); return;
  }
  if (d.aiCancel !== undefined) { state.ai.confirm = false; renderCatalog(); return; }

  if (d.add) { const it = findItem(d.add); setQty(d.add, it.min); return; }
  if (d.inc) {
    const it = findItem(d.inc); const n = Number(state.qty[d.inc]) || 0;
    const nx = Number.isInteger(n) && n >= it.min ? (Math.floor(n / it.step) + 1) * it.step : it.min;
    setQty(d.inc, nx); return;
  }
  if (d.dec) {
    const it = findItem(d.dec); const n = Number(state.qty[d.dec]) || 0;
    const prev = (Math.ceil(n / it.step) - 1) * it.step;
    setQty(d.dec, prev >= it.min ? prev : ''); return;
  }
  if (d.remove) { setQty(d.remove, ''); return; }
  if (d.clear !== undefined) { state.qty = {}; state.boxes = []; state.openBox = -1; state.ai.comment = ''; save(); renderCatalog(); updateMobileBar(); return; }

  if (d.jump) { const el = $(d.jump); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }

  if (d.partner) {
    if (d.partner === state.partner) return;
    if (totals().count) { state.pendingPartner = d.partner; renderSwitchWarning(); return; }
    state.partner = d.partner; state.search = ''; state.boxes = []; state.openBox = -1; resetAi();
    save(); renderCatalog(); updateMobileBar(); return;
  }
  if (d.confirmSwitch !== undefined) {
    state.qty = {}; state.boxes = []; state.openBox = -1; state.partner = state.pendingPartner; state.pendingPartner = ''; state.search = '';
    resetAi();
    save(); renderCatalog(); updateMobileBar(); return;
  }
  if (d.cancelSwitch !== undefined) { state.pendingPartner = ''; renderSwitchWarning(); return; }

  if (d.new !== undefined) { state.result = null; state.step = 1; render(); window.scrollTo({ top: 0 }); }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.qty) {
    const id = el.dataset.qty;
    const v = el.value.replace(/[^\d]/g, '');
    state.qty[id] = v === '' ? '' : Number(v);
    save();
    const line = lineState(findItem(id));
    el.closest('.qty').classList.toggle('invalid', Boolean(line && line.problem));
    renderCart(); updateMobileBar();
    return;
  }
  if (el.dataset.boxSearch !== undefined) {
    state.boxSearch = el.value;
    renderBoxes();
    const input = document.querySelector('[data-box-search]');
    if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
    return;
  }
  if (el.dataset.boxCount !== undefined) {
    const v = el.value.replace(/[^\d]/g, '');
    state.boxes[Number(el.dataset.boxCount)].count = v === '' ? '' : Number(v);
    save(); renderCart(); updateMobileBar(); refreshSteps(); return;
  }
  if (el.dataset.field) { state.details[el.dataset.field] = el.value; save(); refreshSteps(); return; }
  if (el.dataset.approachNote !== undefined) { state.approaches[Number(el.dataset.approachNote)].note = el.value; save(); refreshSteps(); return; }
  if (el.dataset.approachTime !== undefined) { state.approaches[Number(el.dataset.approachTime)].time = el.value; save(); refreshSteps(); return; }
  if (el.dataset.pin !== undefined) { state.pin = el.value; save(); refreshSteps(); }
});

document.addEventListener('change', e => {
  if (e.target.dataset.aiBoxes !== undefined) { state.ai.useBoxes = e.target.checked; return; }
  if (e.target.dataset.boxCount !== undefined) { refreshBoxes(); return; }
  if (e.target.dataset.qty) {
    const id = e.target.dataset.qty;
    if (state.qty[id] === '' || state.qty[id] === 0) delete state.qty[id];
    save(); refreshItem(id); renderCart(); updateMobileBar(); refreshSteps();
  }
});

function refreshSteps() {
  const top = maxStep();
  [1, 2, 3, 4].forEach(n => { $(`step-${n}`).disabled = Boolean(state.result) || n > top; });
}

$('mb-next').addEventListener('click', () => next(2));

/* ================================ Запуск ================================ */
async function start() {
  restore();
  $('demo-note').hidden = !DEMO;
  try {
    let menu;
    if (DEMO) {
      menu = JSON.parse(JSON.stringify(DEMO_MENU));
      if (!Object.keys(state.qty).length) state.qty = { 6: 20, 21: 10, 34: 20, 48: 2 };
      if (!state.details.event) Object.assign(state.details, { event: 'Встреча с партнёрами', guests: '30', waiters: 'нет' });
      if (!state.approaches.some(a => a.tags.length)) state.approaches = [{ tags: ['Выпечка', 'Чай и кофе'], note: '', time: '' }];
    } else {
      const response = await fetch(`${apiUrl}?action=menu`);
      menu = await response.json();
      if (menu.ok === false) throw new Error(menu.message || 'ошибка меню');
    }
    if (!menu.partners || !menu.partners.length) {
      throw new Error('в ответе таблицы нет ни одного партнёра. Проверьте лист «Меню» и опубликуйте новую версию веб-приложения');
    }
    state.menu = normalizeMenu(menu);
    if (!state.menu.partners.some(p => p.name === state.partner)) { state.partner = state.menu.partners[0].name; if (!DEMO) state.qty = {}; }
    const ids = new Set(allItems(currentPartner()).map(e => e.item.id));
    Object.keys(state.qty).forEach(id => { if (!ids.has(id)) delete state.qty[id]; });
    const boxIds = new Set(allItems(currentPartner()).filter(e => e.item.box).map(e => e.item.id));
    state.boxes = currentPartner().box ? state.boxes.filter(b => b && b.items).map(b => {
      Object.keys(b.items).forEach(id => { if (!boxIds.has(id)) delete b.items[id]; });
      return b;
    }) : [];
    state.approaches = state.approaches.slice(0, state.menu.approachMax).map(a => ({
      tags: (a.tags || []).filter(t => state.menu.approachTags.indexOf(t) >= 0), note: a.note || '', time: a.time || '',
    }));
    render();
  } catch (error) {
    $('app').innerHTML = `<div class="alert" role="alert"><b>Не удалось загрузить меню.</b><br>
      Обновите страницу через минуту. Если не помогает — сообщите администратору (${esc(error.message)}).</div>`;
  }
}
start();
</script>
